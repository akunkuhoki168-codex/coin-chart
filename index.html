  <style>
    :root {
      --bg: #0b0e11;
      --panel: #161a1e;
      --elevated: #1e2329;
      --border: #2b3139;
      --text: #eaecef;
      --muted: #848e9c;
      --up: #0ecb81;
      --down: #f6465d;
      --accent: #f0b90b;
      --accent-dim: rgba(240,185,11,0.14);
      --header-h: 56px;
      --tab-h: 56px;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    body {
      overflow: hidden;
      padding-left: var(--safe-l);
      padding-right: var(--safe-r);
    }
    button, input { font-family: inherit; color: inherit; }
    button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    input { -webkit-tap-highlight-color: transparent; }
    img, svg { display: block; }
    #app {
      height: 100dvh;
      height: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }
    #header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: calc(var(--header-h) + var(--safe-t));
      padding: var(--safe-t) 12px 0 12px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      z-index: 20;
    }
    #header-inner {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-height: var(--header-h);
      min-width: 0;
    }
    .coin-trigger {
      display: flex;
      align-items: center;
      gap: 4px;
      background: none;
      border: 0;
      padding: 8px 4px 8px 0;
      min-height: 44px;
      max-width: 42%;
      cursor: pointer;
      text-align: left;
      flex: 0 1 auto;
      min-width: 0;
    }
    .coin-trigger #pair {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chev {
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      color: var(--muted);
    }
    .px-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      margin-left: auto;
      min-width: 0;
      font-variant-numeric: tabular-nums;
    }
    #last {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
    }
    #change {
      font-size: 12px;
      font-weight: 600;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
    }
    .up { color: var(--up); }
    .down { color: var(--down); }
    .live-pill {
      text-transform: none;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex: 0 0 auto;
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 999px;
      padding: 5px 8px;
      min-height: 28px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    .live-pill .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--muted);
    }
    .live-pill.live { color: var(--up); border-color: rgba(14,203,129,0.35); }
    .live-pill.live .dot { background: var(--up); box-shadow: 0 0 0 3px rgba(14,203,129,0.18); }
    .live-pill.connecting .dot, .live-pill.reconnecting .dot { background: var(--accent); }
    .live-pill.error { color: var(--down); }
    .live-pill.error .dot { background: var(--down); }
    .live-pill { cursor: pointer; }
    #diag {
      display: none;
      margin: 0 12px 8px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--muted);
      border-radius: 8px;
      font-size: 11px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      flex: 0 0 auto;
      max-height: 40vh;
      overflow: auto;
    }
    #diag.show { display: block !important; }
    #btn-reset-settings {
      margin-top: 8px;
      min-height: 44px;
      width: 100%;
      border-radius: 10px;
    }
    .icon-btn {
      flex: 0 0 auto;
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      cursor: pointer;
      padding: 0;
    }
    .icon-btn svg { width: 18px; height: 18px; }
    .icon-btn:active { background: var(--elevated); }

    #chart-screen {
      flex: 1;
      min-height: 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    #stats-row {
      display: flex;
      gap: 12px;
      padding: 6px 12px 0;
      font-size: 11px;
      color: var(--muted);
      overflow: hidden;
      flex: 0 0 auto;
    }
    #stats-row b {
      color: var(--text);
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      margin-left: 4px;
    }
    #last-signal {
      padding: 4px 12px 0;
      font-size: 11px;
      color: var(--muted);
      flex: 0 0 auto;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #last-signal .buy { color: var(--up); font-weight: 700; }
    #last-signal .sell { color: var(--down); font-weight: 700; }
    #last-signal .maybe { color: #7dffc0; font-weight: 700; }
    #last-signal .maybe.sell { color: #ff9aa8; }
    .sig-score { color: var(--muted); font-size: 11px; }
    .sig-stars { color: #f0c040; letter-spacing: 1px; font-size: 12px; font-weight: 700; }
    #tf-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      flex: 0 0 auto;
      min-width: 0;
    }
    #tf-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      flex: 1;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    #tf-row::-webkit-scrollbar { display: none; }
    .chip, .btn {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 12px;
      min-height: 36px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .chip:active, .btn:active { background: var(--elevated); }
    .chip.active, .btn.active {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }
    #btn-filters-tf {
      flex: 0 0 auto;
      border-radius: 10px;
    }
    #legend {
      padding: 0 12px 6px;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      min-height: 22px;
      line-height: 1.35;
      max-height: 2.8em;
      overflow: hidden;
      flex: 0 0 auto;
    }
    #legend strong { color: var(--text); font-weight: 600; }
    #error {
      display: none;
      margin: 0 12px 8px;
      padding: 8px 10px;
      border: 1px solid rgba(246,70,93,0.4);
      background: rgba(246,70,93,0.08);
      color: #ff8a80;
      border-radius: 8px;
      font-size: 12px;
      flex: 0 0 auto;
    }
    #error.show { display: block; }
    #charts {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
    }
    #main-chart { flex: 1; min-height: 0; min-width: 0; }
    #rsi-chart { height: 88px; border-top: 1px solid var(--border); flex: 0 0 auto; }
    #rsi-chart.hidden { display: none; }

    /* Sheets / side panels */
    .sheet {
      display: none;
      flex-direction: column;
      background: var(--bg);
      min-width: 0;
      min-height: 0;
    }
    .sheet.open { display: flex; }
    .sheet-head {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: calc(8px + var(--safe-t)) 12px 8px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    @media (max-width: 1023px) {
      .sheet {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: calc(var(--tab-h) + var(--safe-b));
        z-index: 30;
      }
    }
    .sheet-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
    }
    .sheet-title { font-size: 18px; font-weight: 700; flex: 1; }
    .sheet-sub { font-size: 12px; color: var(--muted); }
    .search {
      width: 100%;
      min-height: 44px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--panel);
      padding: 10px 12px;
      font-size: 16px;
      outline: none;
    }
    .search:focus { border-color: var(--accent); }
    .sort-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .sort-row::-webkit-scrollbar { display: none; }
    .sort-row .chip { min-height: 32px; padding: 5px 10px; font-size: 12px; }
    .list {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }
    .coin-row, .signal-card {
      width: 100%;
      text-align: left;
      background: none;
      border: 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      color: inherit;
    }
    .coin-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 12px;
      align-items: center;
      padding: 10px 12px;
      min-height: 56px;
    }
    .coin-row.active { background: var(--accent-dim); }
    .coin-left { min-width: 0; }
    .coin-sym {
      font-weight: 700;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .coin-base { color: var(--muted); font-weight: 500; font-size: 11px; margin-top: 2px; display: flex; gap: 6px; align-items: center; }
    .coin-right { text-align: right; font-variant-numeric: tabular-nums; }
    .coin-px { font-weight: 600; font-size: 14px; }
    .coin-chg { font-size: 12px; font-weight: 600; }
    .scan-badge {
      display: inline-flex;
      align-items: center;
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .scan-badge.bull { background: rgba(14,203,129,0.15); color: var(--up); }
    .scan-badge.bear { background: rgba(246,70,93,0.15); color: var(--down); }

    .signal-card {
      display: block;
      padding: 12px 14px;
      border-left: 3px solid var(--border);
    }
    .signal-card.bull { border-left-color: var(--up); }
    .signal-card.bear { border-left-color: var(--down); }
    .signal-card.forming { border-left-style: dashed; }
    .signal-card.provisional { opacity: 0.75; border-left-style: dashed; }
    .sig-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .sig-name { font-weight: 700; font-size: 14px; }
    .sig-dir.bull { color: var(--up); }
    .sig-dir.bear { color: var(--down); }
    .sig-px { font-variant-numeric: tabular-nums; font-weight: 700; }
    .sig-meta { margin-top: 4px; font-size: 12px; color: var(--muted); }
    .sig-chips { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
    .mini-chip {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 6px;
      border-radius: 999px;
      background: var(--elevated);
      color: var(--muted);
    }
    .empty {
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    /* Settings / filters */
    .filters {
      padding: 12px 12px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .filt-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .tog-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tog {
      min-height: 36px;
    }
    .check-row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      font-size: 14px;
    }
    .check-row input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }
    .num-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
    .num-row input {
      width: 64px;
      min-height: 40px;
      font-size: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 8px;
      text-align: center;
    }
    .hint { font-size: 12px; color: var(--muted); line-height: 1.45; }
    #legend .rng { color: #848e9c; font-weight: 700; }

    /* Bottom sheet */
    #backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 40;
    }
    #backdrop.show { display: block; }
    #filter-sheet {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      max-height: min(86dvh, 720px);
      background: var(--panel);
      border-radius: 16px 16px 0 0;
      z-index: 50;
      transform: translateY(110%);
      transition: transform 0.25s ease;
      display: flex;
      flex-direction: column;
      padding-bottom: var(--safe-b);
      overflow: hidden;
    }
    #filter-sheet.open { transform: translateY(0); }
    .sheet-handle {
      width: 36px; height: 4px; border-radius: 999px;
      background: var(--border);
      margin: 8px auto 4px;
    }
    #filter-sheet .sheet-title-row { padding: 4px 16px 8px; }
    #filter-sheet .filters { overflow-y: auto; -webkit-overflow-scrolling: touch; }

    /* Tab bar */
    #tabbar {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      min-height: calc(var(--tab-h) + var(--safe-b));
      padding: 0 4px var(--safe-b);
      border-top: 1px solid var(--border);
      background: #0f1216;
      z-index: 35;
    }
    .tab {
      appearance: none;
      background: none;
      border: 0;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      min-height: var(--tab-h);
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      position: relative;
    }
    .tab svg { width: 22px; height: 22px; }
    .tab.active { color: var(--accent); }
    .tab-badge {
      position: absolute;
      top: 6px;
      right: calc(50% - 18px);
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      border-radius: 999px;
      background: var(--down);
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      line-height: 16px;
      text-align: center;
      display: none;
    }
    .tab-badge.show { display: block; }

    @media (max-width: 1023px) and (max-height: 800px) {
      #rsi-chart { height: 76px; }
      #stats-row { display: none; }
      #last { font-size: 16px; }
      #last-signal { display: block; }
    }
    @media (max-width: 1023px) and (max-height: 700px) {
      #rsi-chart { height: 68px; }
      #legend { display: none; }
    }

    /* Desktop: coins left, chart center, signals right */
    @media (min-width: 1024px) {
      #app {
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr) 320px;
        grid-template-rows: auto minmax(0, 1fr);
        height: 100dvh;
      }
      #header {
        grid-column: 1 / -1;
        padding-top: var(--safe-t);
      }
      #chart-screen { grid-column: 2; grid-row: 2; }
      #sheet-coins {
        display: flex !important;
        grid-column: 1;
        grid-row: 2;
        position: relative;
        border-right: 1px solid var(--border);
      }
      #sheet-coins .sheet-head { padding-top: 10px; }
      #sheet-signals {
        display: flex !important;
        grid-column: 3;
        grid-row: 2;
        position: relative;
        border-left: 1px solid var(--border);
      }
      #sheet-signals .sheet-head { padding-top: 10px; }
      #sheet-settings { display: none !important; }
      #tabbar { display: none; }
      #stats-row { display: flex; }
      #rsi-chart { height: 120px; }
      #header .chev { display: none; }
      .coin-trigger { max-width: none; cursor: default; pointer-events: none; }
      #filter-sheet {
        left: 50%;
        right: auto;
        bottom: auto;
        top: 50%;
        width: min(560px, calc(100vw - 48px));
        max-height: min(80vh, 720px);
        border-radius: 16px;
        transform: translate(-50%, -40%) scale(0.98);
        opacity: 0;
        pointer-events: none;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }
      #filter-sheet.open {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
        pointer-events: auto;
      }
      .sheet-handle { display: none; }
    }
  </style>
</head>
<body>
  <!-- coin-chart v7.1 swing buy-sell + deep links -->
  <div id="app">
    <header id="header">
      <div id="header-inner">
        <button type="button" class="coin-trigger" id="btn-coin" aria-label="Select coin">
          <span id="pair">PUMP/USDT</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="px-wrap">
          <span id="last">—</span>
          <span id="change">—</span>
        </div>
        <span class="live-pill connecting" id="status"><span class="dot"></span><span id="status-text">Connecting</span></span>
        <button type="button" class="icon-btn" id="btn-filters" aria-label="Filters and indicators">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        </button>
      </div>
    </header>

    <section id="chart-screen">
      <div id="stats-row">
        <span>24h H<b id="high">—</b></span>
        <span>24h L<b id="low">—</b></span>
        <span>Vol<b id="volume">—</b></span>
        <span>Quote<b id="qvolume">—</b></span>
      </div>
      <div id="last-signal">Last: —</div>
      <div id="tf-bar">
        <div id="tf-row"></div>
        <button type="button" class="chip" id="btn-backtest-48h">⏱ Backtest 48H</button>
        <button type="button" class="chip" id="btn-filters-tf">Filters</button>
      </div>
      <div id="legend">Hover a bar for OHLCV</div>
      <div id="error"></div>
      <div id="diag" hidden></div>
      <div id="charts">
        <div id="main-chart"></div>
        <div id="rsi-chart"></div>
      </div>
    </section>

    <section class="sheet" id="sheet-coins">
      <div class="sheet-head">

      setStatusSafe("error", "Error – " + ((bootErr && bootErr.message) ? bootErr.message : "init failed"));
    }
    function checkAppVersion() {
      var url = (location.pathname || "/") + "?ts=" + Date.now() + "&v=" + encodeURIComponent(APP_VERSION);
      fetch(url, { cache: "no-store", headers: { "Cache-Control": "no-cache", "Pragma": "no-cache" } }).then(function (r) {
        return r.text();
      }).then(function (html) {
        var m = String(html).match(/app-version" content="([^"]+)"/);
        if (!m || !m[1] || m[1] === APP_VERSION) return;
        try {
          if (sessionStorage.getItem("coin-chart:reloadedFor") === m[1]) return;
          sessionStorage.setItem("coin-chart:reloadedFor", m[1]);
        } catch (e) {}
        var q = "v=" + encodeURIComponent(m[1]) + "&ts=" + Date.now();
        try {
          if (state && state.symbol && state.tf) {
            q = "symbol=" + encodeURIComponent(state.symbol) + "&tf=" + encodeURIComponent(state.tf) + "&" + q;
          }
        } catch (e2) {}
        location.replace((location.pathname || "/") + "?" + q);
      }).catch(function () {});
    }
    try { checkAppVersion(); } catch (e) {}
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible") {
        try { checkAppVersion(); } catch (e) {}
      }
    });
  })();
  </script>
</body>
</html>
